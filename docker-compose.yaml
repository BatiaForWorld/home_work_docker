services:
  db:
    image: postgres:17.8
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2.0
    env_file: .env
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-server --requirepass "$$REDIS_PASSWORD"; else redis-server; fi'
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build: .
    env_file: .env
    command: >-
      sh -c "until pg_isready -h db -p 5432 -U \"$${POSTGRES_USER:-app_user}\" -d \"$${POSTGRES_DB:-app_db}\"; do sleep 1; done; python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    env_file: .env
    command: >-
      sh -c "until pg_isready -h db -p 5432 -U \"$${POSTGRES_USER:-app_user}\" -d \"$${POSTGRES_DB:-app_db}\"; do sleep 1; done; celery -A config worker -l info"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    env_file: .env
    command: >-
      sh -c "until pg_isready -h db -p 5432 -U \"$${POSTGRES_USER:-app_user}\" -d \"$${POSTGRES_DB:-app_db}\"; do sleep 1; done; celery -A config beat -l info"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
