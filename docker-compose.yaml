services:

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command: >-
      sh -c "until pg_isready -h db -p 5432 -U \"$${POSTGRES_USER:-app_user}\" -d \"$${POSTGRES_DB:-app_db}\"; do sleep 1; done;
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - staticfiles:/staticfiles
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:17.8
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2.0
    env_file: .env
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-server --requirepass "$$REDIS_PASSWORD"; else redis-server; fi'
    volumes:
      - staticfiles:/staticfiles
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command: >-
      sh -c "until pg_isready -h db -p 5432 -U \"$${POSTGRES_USER:-app_user}\" -d \"$${POSTGRES_DB:-app_db}\"; do sleep 1; done; celery -A config worker -l info"
    volumes:
      - staticfiles:/staticfiles
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command: >-
      sh -c "until pg_isready -h db -p 5432 -U \"$${POSTGRES_USER:-app_user}\" -d \"$${POSTGRES_DB:-app_db}\"; do sleep 1; done; celery -A config beat -l info"
    volumes:
      - staticfiles:/staticfiles
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/staticfiles:ro
    restart: unless-stopped
    depends_on:
      - web


volumes:
  postgres_data:
  staticfiles:
